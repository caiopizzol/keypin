<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>keypin · a map of every app key across your projects</title>
    <meta
      name="description"
      content="A map of every app key across your projects, published to the account it's pinned to. Values stay in your vault."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="0.25"
          y="0.25"
          width="23.5"
          height="23.5"
          rx="3"
          fill="#F4F3EE"
          stroke="#C9C7BD"
          stroke-width="0.5"
        />
        <g transform="translate(4 4)" shape-rendering="crispEdges">
          <rect x="1" y="5" width="6" height="2" fill="#121311" />
          <rect x="1" y="9" width="6" height="2" fill="#121311" />
          <rect x="1" y="7" width="2" height="2" fill="#121311" />
          <rect x="5" y="7" width="2" height="2" fill="#121311" />
          <rect x="7" y="7" width="3" height="2" fill="#121311" />
          <rect x="9" y="9" width="2" height="2" fill="#0B6E36" />
          <rect x="11" y="7" width="2" height="2" fill="#0B6E36" />
          <rect x="13" y="5" width="2" height="2" fill="#0B6E36" />
        </g>
      </svg>
      <h1>keypin</h1>
      <p class="tag">
        A map of every app key across your projects, published to the account it's pinned to.
        <strong>Values stay in your vault.</strong>
      </p>
      <div class="install">
        <code><span class="p">$</span> bun add -g keypin</code>
        <button
          type="button"
          onclick="
            navigator.clipboard?.writeText('bun add -g keypin').then(
              () => (this.textContent = 'copied'),
              () => {},
            )
          "
        >
          copy
        </button>
      </div>
      <div class="links">
        <a href="https://github.com/caiopizzol/keypin">GitHub</a>
        <a href="https://www.npmjs.com/package/keypin">npm</a>
      </div>
      <p class="req">Needs Bun 1.4.4+ and the 1Password desktop app.</p>
    </main>
    <footer>
      <span>keypin · MIT</span><a href="https://github.com/caiopizzol/keypin#readme">README</a>
    </footer>
  </body>
</html>
