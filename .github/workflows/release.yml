name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-pr-title:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: report pr-title on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --state open --label "autorelease: pending" --json number,headRefOid,title --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR."
            exit 0
          fi
          sha=$(printf '%s' "$pr" | jq -r .headRefOid)
          printf '%s' "$pr" | jq -r .title > "$RUNNER_TEMP/title"
          if sh scripts/check-commit-title.sh "$RUNNER_TEMP/title"; then conclusion=success; else conclusion=failure; fi
          gh api "repos/$REPO/check-runs" -f name=pr-title -f head_sha="$sha" -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=Release PR title" -f "output[summary]=$(cat "$RUNNER_TEMP/title")"
          [ "$conclusion" = success ]

  npm-packages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: check every platform package exists on npm
        run: |
          missing=
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@keypin%2fcli-$target")
            case $status in
              200) echo "@keypin/cli-$target is on npm" ;;
              404) missing="$missing @keypin/cli-$target" ;;
              *) echo "::error::npm answered $status for @keypin/cli-$target"; exit 1 ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Not on npm yet:$missing. Trusted publishing can't create a package, so nothing was published. Publish a first version of each by hand and add release.yml as its trusted publisher (docs/development.md, Releases), then re-run this workflow."
            exit 1
          fi

  binaries:
    needs: [release-please, npm-packages]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run compile ${{ matrix.target }}
        working-directory: apps/cli
      - run: bun run check-binary binaries/keypin-${{ matrix.target }}
        working-directory: apps/cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keypin-${{ matrix.target }}
          path: apps/cli/binaries/keypin-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, npm-packages, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: apps/cli/binaries
          merge-multiple: true
      - run: bun run pack
        working-directory: apps/cli
      - name: publish the platform packages, then keypin
        working-directory: apps/cli/packages
        run: |
          for package in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 keypin; do
            spec=$(node -p "const p = require('./$package/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              (cd "$package" && npm publish --access public)
            fi
          done
